name: ETN Android APK

on:
  push:
    paths:
      - 'android-etn/**'
      - 'demo/etn/**'
      - '.github/workflows/etn-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Copy bundled ETN interface
        run: |
          mkdir -p android-etn/app/src/main/assets
          cp demo/etn/index.html demo/etn/style.css demo/etn/i18n.js demo/etn/discoveries.js demo/etn/app.js android-etn/app/src/main/assets/
          cp -R demo/etn/vendor android-etn/app/src/main/assets/
          curl -fL --retry 3 -o /tmp/etn-full.zip https://github.com/tomas-pak0/etn/releases/download/v0.6.7/ETN-0.6.7-source.zip
          unzip -q /tmp/etn-full.zip 'ETN/data/*' -d /tmp/etn-full
          cp -R /tmp/etn-full/ETN/data android-etn/app/src/main/assets/
      - name: Build debug APK
        working-directory: android-etn
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ETN-0.6.8-debug-build
          path: android-etn/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
