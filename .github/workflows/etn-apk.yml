name: ETN Android APK

on:
  push:
    paths:
      - 'android-etn/**'
      - 'demo/etn/**'
      - '.github/workflows/etn-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Copy bundled ETN interface
        run: |
          mkdir -p android-etn/app/src/main/assets
          cp demo/etn/index.html demo/etn/style.css demo/etn/i18n.js demo/etn/app.js android-etn/app/src/main/assets/
          cp -R demo/etn/vendor demo/etn/data android-etn/app/src/main/assets/
      - name: Build debug APK
        working-directory: android-etn
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ETN-0.5.1-build
          path: android-etn/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
